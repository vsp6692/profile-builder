.tool-button{display:inline-flex;align-items:center;gap:8px;padding:10px 11px;border:1px solid var(--line);border-radius:5px;background:var(--paper);color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;transition:background .18s,border-color .18s,transform .18s;min-height:47px}
.tool-button img{width:25px;height:25px;object-fit:contain;filter:grayscale(1);opacity:.8}
.tool-button:hover{transform:translateY(-2px);border-color:var(--blue);background:var(--wash)}
.tool-button[aria-pressed="true"]{border-color:var(--blue);color:var(--blue);background:#edf3ff}
.tool-button[aria-pressed="true"] img{filter:brightness(0) saturate(100%) invert(30%) sepia(94%) saturate(1500%) hue-rotate(208deg) brightness(85%);opacity:1}
.skill .tool-detail{font-size:14px;line-height:1.65;padding:12px 14px;border-left:2px solid var(--blue);background:var(--wash);margin-bottom:16px;min-height:118px}
.tool-detail strong{color:var(--ink)}
@media(max-width:700px){.skill .tool-detail{min-height:0}}
@media(prefers-reduced-motion:reduce){.tool-button{transition:none}.tool-button:hover{transform:none}}
</style>

<section id="top" class="hero" aria-labelledby="name"><div class="wrap"><p class="eyebrow">${esc(d.title)}</p><h1 id="name">${esc(d.name)}</h1><p class="pitch">${esc(d.pitch)}</p><div class="hero-bottom">${contacts()}<a class="download" id="download-resume" download="${esc(d.resume.filename)}">${icon('download')}Download PDF resume</a></div></div></section>
<section id="summary" class="section"><div class="wrap"><div class="section-grid reveal">${heading('01','Summary')}<div class="summary-text">${d.summary.map(p=>`<p>${esc(p)}</p>`).join('')}</div></div><div class="highlights reveal" aria-label="Career highlights">${d.highlights.map(s=>`<div class="stat"><strong>${esc(s.value)}</strong><span>${esc(s.label)}</span></div>`).join('')}</div></div></section>
<section id="skills" class="section"><div class="wrap section-grid reveal">${heading('02','Core skills')}<div class="skills-grid">${d.skills.map(s=>`<div class="skill"><h3>${esc(s.category)}</h3><div class="tool-list" aria-label="${esc(s.category)} tools">${(s.tools||[]).map((t,i)=>`<button class="tool-button" type="button" aria-pressed="${i===0}" data-tool="${i}"><img src="${toolLogos[t.icon]}" alt="" width="25" height="25"><span>${esc(t.name)}</span></button>`).join('')}</div><p class="tool-detail" aria-live="polite" aria-atomic="true">${s.tools?.length?`<strong>${esc(s.tools[0].name)}.</strong> ${esc(s.tools[0].detail)}`:''}</p><p>${s.items.map(esc).join(' · ')}</p></div>`).join('')}</div></div></section>
<section id="experience" class="section"><div class="wrap"><div class="experience-heading">${heading('03','Experience')}</div>${d.experience.map(job=>`<article class="job reveal"><div class="job-meta"><p class="company">${esc(job.company)}</p><p class="job-dates">${esc(job.dates)}</p><p class="job-location">${esc(job.location)}</p></div><div class="job-content"><h3>${esc(job.role)}</h3>${job.groups.map(g=>`<div class="job-group"><h4>${esc(g.heading)}</h4>${g.dates?`<p class="group-dates">${esc(g.dates)}</p>`:''}<ul>${g.bullets.map(b=>`<li>${esc(b)}</li>`).join('')}</ul></div>`).join('')}</div></article>`).join('')}</div></section>
<section id="education" class="section"><div class="wrap section-grid reveal">${heading('04','Education')}<div>${d.education.map(e=>`<article class="education-item"><h3>${esc(e.school)}</h3><div class="education-meta"><p>${esc(e.degree)} · ${esc(e.location)}</p><p>${esc(e.dates)}</p></div></article>`).join('')}</div></div></section>`;
document.getElementById('contact').innerHTML=`<div class="wrap"><div class="footer-top"><h2>Get in touch.</h2>${contacts()}</div><div class="footer-bottom"><span>© ${new Date().getFullYear()} ${esc(d.name)}</span><a href="#top">Back to top ↑</a></div></div>`;
document.querySelectorAll('.skill').forEach((card,index)=>{
 card.querySelectorAll('.tool-button').forEach(button=>button.addEventListener('click',()=>{
  const tool=d.skills[index].tools[Number(button.dataset.tool)];
  card.querySelectorAll('.tool-button').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));
  card.querySelector('.tool-detail').innerHTML=`<strong>${esc(tool.name)}.</strong> ${esc(tool.detail)}`;
 }));
});
const menu=document.querySelector('.menu-button'),nav=document.getElementById('navigation');
function closeMenu(){menu.setAttribute('aria-expanded','false');nav.classList.remove('open')}
menu.addEventListener('click',()=>{const open=menu.getAttribute('aria-expanded')!=='true';menu.setAttribute('aria-expanded',String(open));nav.classList.toggle('open',open)});
nav.addEventListener('click',event=>{if(event.target.closest('a'))closeMenu()});
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&menu.getAttribute('aria-expanded')==='true'){closeMenu();menu.focus()}});
// Content starts visible, so lack of IntersectionObserver never hides anything.
if('IntersectionObserver' in window){
 const revealObserver=new IntersectionObserver(entries=>entries.forEach(entry=>{if(entry.isIntersecting){entry.target.classList.add('in-view');revealObserver.unobserve(entry.target)}}),{threshold:.05});
 if(!matchMedia('(prefers-reduced-motion: reduce)').matches)document.querySelectorAll('.reveal').forEach(el=>revealObserver.observe(el));
 const sectionObserver=new IntersectionObserver(entries=>entries.forEach(entry=>{if(entry.isIntersecting){nav.querySelectorAll('a').forEach(a=>{if(a.hash==='#'+entry.target.id)a.setAttribute('aria-current','location');else a.removeAttribute('aria-current')})}}),{rootMargin:'-15% 0px -55% 0px',threshold:0});
 document.querySelectorAll('main>section[id]:not(#top),footer').forEach(el=>sectionObserver.observe(el));
}
// Convert the embedded original PDF to a local download, with no network request.
window.addEventListener('DOMContentLoaded',()=>{
 const encoded=document.getElementById(d.resume.embeddedAssetId).textContent.trim();
 const bytes=Uint8Array.from(atob(encoded),c=>c.charCodeAt(0));
 const url=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'}));
 document.getElementById('download-resume').href=url;
});
</script>
